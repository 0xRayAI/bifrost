@font-face { font-family: "Inter"; font-style: normal; font-weight: 400; font-display: swap; src: url("inter-latin-400.woff2") format("woff2"); }
@font-face { font-family: "Inter"; font-style: normal; font-weight: 600; font-display: swap; src: url("inter-latin-600.woff2") format("woff2"); }
@font-face { font-family: "JetBrains Mono"; font-style: normal; font-weight: 400; font-display: swap; src: url("jetbrains-mono-latin-400.woff2") format("woff2"); }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 "Inter", system-ui, -apple-system, "Segoe UI", sans-serif; }
main { max-width: 1100px; margin: 0 auto; padding: 12px; }
header .title { animation: rise .6s ease-out both; }
.title { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
#themeToggle { margin-left: auto; flex: none; }
#mark { width: 112px; height: 44px; flex: none; }
.pill { display: inline-block; width: 11ch; text-align: center; white-space: nowrap; flex: none; font-size: 11px; font-weight: 700; letter-spacing: .08em; padding: 3px 8px; border-radius: 999px; border: 1px solid var(--teal); color: var(--pill-fg); background: var(--pill-bg); }
.pill::before { content: "\25CF  "; color: var(--pill-live); animation: blink 1.6s ease-in-out infinite; }
.fleet { margin-left: auto; text-align: right; white-space: nowrap; font-size: 11px; line-height: 1.5; color: var(--dim); font-variant-numeric: tabular-nums; }
.fleet b { color: var(--text); font-weight: 600; }
#blackout { color: var(--warn); font-weight: 700; font-size: 13px; letter-spacing: .02em; }
.pill.off { border-color: var(--line); color: var(--dim); background: var(--pill-off-bg); }
.pill.off::before { color: var(--dim); animation: none; }
.pill.behind { border-color: var(--behind-edge); color: var(--behind-fg); background: var(--behind-bg); }
.pill.behind::before { color: var(--behind-dot); animation: none; }
.seat { position: relative; }
#mesh { opacity: 0; transition: opacity 1.2s ease-out; background: var(--plate); }
#mesh.in { opacity: 1; }
@keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
@keyframes blink { 50% { opacity: .35; } }
@media (prefers-reduced-motion: reduce) {
  header .title, .pill::before { animation: none; }
  #mesh { transition: none; }
}
header h1 { font-size: 20px; margin: 0; letter-spacing: .04em; }
main > header {
  position: sticky;
  top: 0;
  z-index: 40;
  background: var(--bg);
  margin-bottom: 8px;
  padding-bottom: 8px;
}
#meshPanel .mesh-controls {
  flex: none;
  margin-top: 8px;
  padding-top: 8px;
  border-top: 1px solid var(--hairline);
  background: transparent;
}
.status b[title] { cursor: help; }
header h1 span { color: var(--dim); font-size: 13px; font-weight: 400; letter-spacing: 0; margin-left: 8px; }
.status { color: var(--dim); font-size: 13px; margin: 4px 0 0; }
.status b { color: var(--text); font-weight: 600; }
.status .err { color: var(--danger); }
.note { color: var(--dim); font-size: 12px; margin: 2px 0 10px; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; margin-bottom: 8px; }
#seatGrid { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.seat { display: inline-flex; gap: 8px; align-items: center; width: max-content; max-width: 16rem; flex: none; min-width: 0; }
button.seat { background: transparent; border: 0; padding: 0; color: inherit; font: inherit; cursor: pointer; }
.seat.idle { opacity: .45; }
.seat.seen { opacity: 1; }
.seat.dormant { opacity: .35; }
.seat.dormant .nm { font-style: italic; }
.dot { width: 14px; height: 14px; border-radius: 50%; background: var(--dot-off); flex: none; }
.seat .nm { min-width: 0; max-width: 8rem; flex: 0 1 auto; font-weight: 700; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: rgb(var(--nm)); }
/* The working label's sheen, on the roster name: dim seat color with a full-color band sweeping left to right while .live (seatView.lit). 1.2s is the old canvas travel. */
.seat.live:not(.silent) .nm {
  background-image: linear-gradient(90deg, rgba(var(--nm), .45) 0%, rgba(var(--nm), .45) 38%, rgb(var(--nm)) 50%, rgba(var(--nm), .45) 62%, rgba(var(--nm), .45) 100%);
  background-size: 220% 100%;
  background-repeat: no-repeat;
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  animation: nm-roll 1.2s linear infinite;
}
@keyframes nm-roll { from { background-position: 100% 0; } to { background-position: 0% 0; } }
@media (prefers-reduced-motion: reduce) {
  .seat.live:not(.silent) .nm { animation: none; background-image: none; color: rgb(var(--nm)); }
}
.seat .role { color: var(--dim); font-size: 11px; font-weight: 450; white-space: nowrap; }
.seat.live .role { color: var(--text); }
.lens-head { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; font-size: 12px; color: var(--dim); align-items: center; }
#head { color: var(--teal); font-weight: 700; font-size: 15px; }
#headTime { color: var(--dim); font-size: 12px; font-family: "JetBrains Mono", ui-monospace, monospace; }
canvas { display: block; width: 100%; height: auto; }
.controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
#meshPanel { display: flex; flex-direction: column; height: 720px; max-height: 720px; overflow: hidden; min-height: 0; }
#seats { flex: 0 1 auto; max-height: 8.5rem; min-height: 0; display: flex; flex-direction: column; margin: 0; background: transparent; border: 0; padding: 0; }
#seats > .fold-head { flex: none; }
#seats > .fold-body { flex: 1 1 auto; min-height: 0; max-height: none; overflow: auto; }
#statsFold { margin: 0 0 12px; border: 1px solid var(--line); border-radius: 8px; padding: 0 8px; background: transparent; }
#statsFold:not(.collapsed) { background: var(--stat-bg); }
#kanban { margin-top: 12px; }
.mesh-legend { color: var(--dim); font-size: 11px; margin: 6px 0 0; display: flex; flex-wrap: wrap; gap: 8px; }
.mesh-legend span { border-bottom: 1px dotted var(--dim); cursor: help; }
.spectrum-pill { display: inline-block; flex: none; font-size: 11px; font-weight: 700; letter-spacing: .08em; padding: 3px 8px; border-radius: 999px;
  color: var(--on); border: 1px solid var(--spectrum-edge); background: var(--spectrum-bg); }
.spectrum-meter { display: inline-flex; align-items: flex-end; gap: 2px; height: 16px; flex: none; }
.spectrum-pill[hidden], .spectrum-meter[hidden], #pill[hidden] { display: none !important; }
.spectrum-meter i { display: block; width: 3px; border-radius: 1px; }
@media (prefers-reduced-motion: reduce) { .spectrum-meter i { transition: none; } }
main { max-width: 1560px; }
.split { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: 12px; align-items: stretch; }
.split > .panel { margin: 0; min-width: 0; }
#agentPing[hidden], #agentPing:empty { display: none; }
.wave { display: flex; flex-direction: column; height: 720px; max-height: 720px; overflow: hidden; isolation: isolate; }
.wave-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 12px; color: var(--dim); }
.wave-head b { color: var(--head-strong); font-size: 13px; letter-spacing: .04em; }
#waveToggle { display: none; }
.wave-stats { display: grid; grid-template-columns: repeat(8, 1fr); gap: 4px; margin-top: 6px; }
.wstat { display: flex; flex-direction: column; align-items: center; padding: 3px 2px; border: 1px solid var(--stat-line); border-radius: 6px; background: var(--stat-bg); color: var(--text); width: 100%; }
button.wstat { font: inherit; cursor: pointer; }
button.wstat.on { outline: 2px solid var(--focus); background: var(--panel); }
.wstat b { color: var(--stat-num); font-size: 14px; } .wstat small { color: var(--stat-label); font-size: 9px; text-align: center; line-height: 1.1; }
.wstat.total { border-color: var(--stat-total); }
@media (max-width: 900px) { .wave.collapsed .wave-stats { display: none; } }
.wave-body { flex: 1 1 auto; min-height: 220px; overflow-y: auto; margin-top: 6px; padding-right: 2px; }
.wgroup { position: sticky; top: 0; z-index: 3; margin: 0; padding: 8px 0 4px; background: var(--stat-bg); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }

    li.setAttribute('aria-expanded', open ? 'true' : 'false');
    var when = document.createElement('span');
    when.className = 'when';
    when.textContent = t === t ? L.fmtCt(t).replace(' CT', '') : (e.t_ct || '');
    var who = document.createElement('span');
    who.className = 'who';
    who.textContent = detail ? detail.seat : (L.whoTag ? L.whoTag(e) : (e.from || ''));
    who.style.color = rgb(L.eventColor(e));
    li.appendChild(when);
    li.appendChild(who);
    var prompt = L.promptView && L.promptView(e);
    var labelText = prompt ? prompt.short : (detail ? detail.label : L.cleanLabel(e.label || e.kind || ''));
    var href = detail && detail.href ? detail.href : '';
    if (href && !prompt) {
      var a = document.createElement('a');
      a.textContent = labelText;
      a.href = href; a.target = '_blank'; a.rel = 'noopener';
      li.appendChild(a);
    } else {
      var span = document.createElement('span');
      span.className = prompt ? 'prompt-line' : '';
      span.textContent = labelText;
      li.appendChild(span);
    }
    if (detail) {
      var box = document.createElement('div');
      box.className = 'log-detail';
      box.hidden = !open;
      var meta = document.createElement('div');
      meta.className = 'log-meta';
      meta.textContent = detail.seat + ' · ' + (t === t ? L.fmtCt(t) : (e.t_ct || ''));
      box.appendChild(meta);
      if (detail.card) {
        var card = document.createElement(href ? 'a' : 'span');
        card.className = 'log-card';
        card.textContent = detail.card;
        if (href) { card.href = href; card.target = '_blank'; card.rel = 'noopener'; }
        box.appendChild(card);
      }
      var note = document.createElement('div');
      note.className = 'log-note';
      note.textContent = detail.note;
      box.appendChild(note);
      li.appendChild(box);
    }
    ul.appendChild(li);
  }
  function renderLog(shown) {
    var ul = $('log'); ul.textContent = '';
    var lines = L.activityLines ? L.activityLines(state.events, shown, 14) : [];
    for (var i = lines.length - 1; i >= 0; i--) appendLogRow(ul, lines[i]);
    foldSum('activitySum', String(ul.children.length));
  }

  function goLive() { endReplay(); state.live = true; setTimeout(playFresh, 0); playing = false; releaseLive = false; state.t = Date.now(); lastText = 0; }
  function rewindTo(t) { endReplay(); state.live = false; flashes = []; state.t = t; lastText = 0; }

  $('live').addEventListener('click', goLive);
  $('ambient').checked = ambientOn; $('ambient').disabled = reduced;
  if (reduced) $('ambient').parentNode.title = 'Replay loop is off (reduced motion)';
  $('ambient').addEventListener('change', function (ev) { ambientOn = ambientStats.on = !reduced && ev.target.checked; ambient = null; readSpectrum(); });
  $('play').addEventListener('click', function () {
    if (state.live) { if (!reduced) startReplay(); lastText = 0; return; }
    if (playing) { playing = false; releaseLive = false; lastText = 0; return; }
    if (reduced) { lastText = 0; return; }
    /* A pause parked within 2s of now would let the next frame snap live. Rewind into the
       canned replay. Further behind continues from state.t. The 250ms frame cap times speed
       is 2.5 min at 600× and 15 min at 3600×, so it is not this distance. */
    if (state.t + 2000 >= Date.now()) { if (!startReplay()) { lastText = 0; return; } }
    playing = true; releaseLive = false; lastText = 0;
  });
  $('speed').addEventListener('change', function (ev) { endReplay(); speed = Number(ev.target.value) || 600; });
  $('slider').addEventListener('input', function (ev) {
    var v = Number(ev.target.value), b = L.bounds(state.events, Date.now());
    if (L.sliderAction(v, b) === 'live') goLive(); else { rewindTo(v); playing = true; releaseLive = false; }
  });
  $('slider').addEventListener('pointerdown', function () { dragging = true; });
  window.addEventListener('pointerup', function () { dragging = false; });
  $('log').addEventListener('click', function (ev) {
    if (ev.target.closest && ev.target.closest('a[href]')) return;
    var li = ev.target.closest ? ev.target.closest('li') : null;
    if (!li) return;
    var det = li.querySelector('.log-detail');
    if (!det) return;
    var open = !li.classList.contains('open');
    li.classList.toggle('open', open);
    li.setAttribute('aria-expanded', open ? 'true' : 'false');
    det.hidden = !open;
    if (li.dataset.id) openLog[li.dataset.id] = open;
  });

  function frame(nowWall) {
    // A hidden tab keeps the painted card ages. The show path repaints them.
    if (document.hidden) {
      lastFrame = nowWall;
      requestAnimationFrame(frame);
      return;
    }
    var dt = Math.min(250, nowWall - lastFrame); lastFrame = nowWall;
    if (playing && (replay || !state.live)) {
      if (replay) state.live = false;
      var step = dt * speed;
      if (!replay) {
        /* 600× turns one 250ms frame into 2.5 min (15 min at 3600×). A continue
           that started outside the 2s band must not reach now on that frame.
           The cap parks 2s short. The next frame may reach now; capping again
           would stay 2s behind for as long as the wall clock moves. */
        var room = Date.now() - state.t - 2000;
        if (releaseLive) releaseLive = false;
        else if (room > 0 && step > room) { step = room; releaseLive = true; }
      }
      state.t += step;
      if (state.t >= Date.now() || (replay && state.t >= replay.end)) goLive();
    } else if (state.live) state.t = Date.now();
    try {
      var pings = currentPings(nowWall);
      var hot = draw(nowWall, pings);
      canvas.classList.add('in');
      updateText(nowWall, hot);
    } catch (err) { warnOnce('frame:' + err.message, 'frame error (loop continues): ' + err.message); }
    requestAnimationFrame(frame);
  }

  var light = { dataAt: 0, cardsAt: 0, moveAt: 0 };
  var feedLoaded = false;
  function paintFresh(now) {
    var box = $('fresh'), text = $('freshText');
    if (!box || !text) return;
    var tone = '', line = 'Loading…';
    if (feedLoaded && L.freshTone) {
      var painted = L.freshTone(light.dataAt, light.cardsAt, light.moveAt, now);
      tone = painted.tone;
      line = painted.line;
    }
    box.classList.remove('green', 'amber', 'red');
    if (tone) box.classList.add(tone);
    text.textContent = line;
  }
  var lastQueue = null;
  function renderQueue(lines) {
    lastQueue = lines;
    var ul = $('queueList'), lab = $('queueLabel');
    if (!ul) return;
    ul.textContent = '';
    var asks = { packet: 1, dispatch: 1, ready: 1, critic_fail: 1, needs_human: 1, issue_comment: 1, pr_comment: 1, pr_open: 1, issue_open: 1, comment: 1, pr: 1, issue: 1 };
    var rows = (lines || []).filter(function (l) { return l && asks[l.type]; });
    if (lab) lab.textContent = 'Queue · open asks';
    if (!rows.length) { ul.appendChild(wbEl('li', '', 'No open asks')); foldSum('queueSum', '0'); return; }
    rows.forEach(function (l) {
      var li = wbEl('li', 'wcard');
      paintEdge(li, l.seat);
      var age = l.t_ct ? wbAge(Date.parse(l.t_ct)) : '';
      li.appendChild(wbEl('span', '', [l.seat || '—', l.type || '', l.title || l.id || '', age].filter(Boolean).join(' · ')));
      ul.appendChild(li);
    });
    foldSum('queueSum', String(rows.length));
  }
  var cardHistRows = [], cardHistOn = false;
  function recentState(s) {
    var id = statusId(s);
    if (id === 'review') return 'in review';
    if (id === 'held' || id === 'parked') return 'parked';
    if (id === 'closed') return 'closed';
    return statusLabel(s, '');
  }
  function changeVerb(c) {
    if (!c) return '';
    if (c.verb === 'merged' || c.merged_by) return 'merged';
    var id = String(c.id || c.key || '').toLowerCase();
    var live = (wb.allCards || wb.cards || []).filter(function (x) { return String(x.key || '').toLowerCase() === id; })[0];
    if (live && (live.merged_by || (live.beats || []).some(function (b) { return /merge/i.test(String(b.what || '')); }))) return 'merged';
    if (statusId(c.state) === 'closed' || c.verb === 'closed') return 'closed';
    return c.verb || recentState(c.state);
  }
  function historyCard(c) {
    var li = wbEl('li', 'wcard hist');
    paintEdge(li, c.owner);
    var top = wbEl('div', 'wtop');
    top.appendChild(wbEl('span', 'witem', (c.number ? '#' + c.number + ' ' : '') + (c.title || c.id || '')));
    var when = c.updated_ct || c.closed_ct || c.opened_ct;
    top.appendChild(wbEl('span', 'wage', when ? (wbCt(when) || when) : ''));
    li.appendChild(top);
    var meta = wbEl('div', 'wmeta');
    meta.appendChild(wbEl('span', '', [c.owner || '—', changeVerb(c), c.merged_by || ''].filter(Boolean).join(' · ')));
    meta.appendChild(wbEl('span', 'wbadge state', changeVerb(c)));
    li.appendChild(meta);
    return li;
  }
  function renderCardRecent() {
    var ul = $('cardRecentList'); if (!ul) return;
    ul.textContent = '';
    var rows = cardHistRows.filter(function (c) {
      if (!c || !c.state) return false;
      var id = statusId(c.state);
      return id !== 'live' && id !== 'open';
    }).slice(0, 5);
    if (!rows.length) { ul.appendChild(wbEl('li', '', 'No recent changes')); foldSum('recentSum', '0'); return; }
    rows.forEach(function (c) { ul.appendChild(historyCard(c)); });
    foldSum('recentSum', String(rows.length));
  }
  function renderCardHist() {
    var ul = $('cardHistList'); if (!ul) return;
    ul.textContent = '';
    if (!cardHistRows.length) { ul.appendChild(wbEl('li', '', 'No cards')); foldSum('historySum', '0'); return; }
    cardHistRows.forEach(function (c) { ul.appendChild(historyCard(c)); });
    foldSum('historySum', String(cardHistRows.length));
  }
  function loadCardHist(attempt) {
    var n = attempt || 0;
    var rows = [];
    var seen = {};
    function take(cursor) {
      if (cursor && seen[cursor]) return Promise.resolve(null);
      if (cursor) seen[cursor] = true;
      var url = '/history/cards?limit=1000';
      if (cursor) url += '&cursor=' + encodeURIComponent(cursor);
      return fetch(url, { headers: { Accept: 'application/json' } }).then(function (r) {
        if (!r.ok) throw new Error('history');
        return r.json();
      }).then(function (b) {
        if (!b || !Array.isArray(b.cards)) return null;
        rows = rows.concat(b.cards);
        if (b.next && rows.length < 20000) return take(b.next);
        return b;
      });
    }
    take('').then(function (b) {
      if (!b) return;
      cardHistRows = rows;
      renderCardRecent();
      renderCardHist();
      if (b.ready === false && n < 600) setTimeout(function () { loadCardHist(n + 1); }, 3000);
    }).catch(function () {
      if (n < 600) setTimeout(function () { loadCardHist(n + 1); }, 3000);
    });
  }
  function showCardHist(on) {
    cardHistOn = !!on;
    var wave = $('wave');
    var box = $('cardHist');
    if (wave) wave.classList.toggle('hist-open', cardHistOn);
    if (!box) return;
    if (cardHistOn) {
      box.classList.remove('collapsed');
      var head = box.querySelector('.fold-head');
      if (head) head.setAttribute('aria-expanded', 'true');
    }
  }
  var histBtn = $('cardHistAll');
  if (histBtn) histBtn.addEventListener('click', function (ev) {
    ev.preventDefault();
    ev.stopPropagation();
    showCardHist(true);
  });
  var histBack = $('waveHistBack');
  if (histBack) histBack.addEventListener('click', function (ev) {
    ev.preventDefault();
    ev.stopPropagation();
    showCardHist(false);
  });
  function loadHistoryDays() {
    var sel = $('historyDay'); if (!sel) return;
    fetch('/history', { headers: { Accept: 'application/json' } }).then(function (r) {
      if (!r.ok) return null;
      return r.json();
    }).then(function (b) {
      if (!b || !Array.isArray(b.days)) return;
      var keep = sel.value;
      sel.textContent = '';
      var live = document.createElement('option'); live.value = ''; live.textContent = 'Live'; sel.appendChild(live);
      for (var i = b.days.length - 1; i >= 0; i--) {
        var o = document.createElement('option'); o.value = b.days[i]; o.textContent = b.days[i]; sel.appendChild(o);
      }
      if (keep) sel.value = keep;
    }).catch(function () {});
  }
  var historySel = $('historyDay');
  if (historySel) {
    historySel.addEventListener('focus', loadHistoryDays);
    historySel.addEventListener('change', function () {
      var day = historySel.value;
      var lab = $('activityLabel');
      if (!day) { if (lab) lab.textContent = 'Activity'; lastLogKey = ''; return; }
      fetch('/history?date=' + encodeURIComponent(day), { headers: { Accept: 'application/json' } }).then(function (r) {
        if (!r.ok) return null;
        return r.json();
      }).then(function (b) {
        if (!b || historySel.value !== day) return;
        if (lab) lab.textContent = 'History · ' + day;
        var ul = $('log'); if (!ul) return;
        ul.textContent = '';
        var events = b.events || [];
        if (!events.length) { ul.appendChild(wbEl('li', '', 'No events this day')); return; }
        events.slice().sort(function (a, b) { return (Date.parse(b.t_ct) || 0) - (Date.parse(a.t_ct) || 0); }).forEach(function (e) {
          appendLogRow(ul, e);
        });
      }).catch(function () {});
    });
  }
  function foldSaved() {
    try { return JSON.parse(localStorage.getItem('bifrost-folds') || '{}'); } catch (e) { return {}; }
  }
  function saveFold(id, open) {
    var saved = foldSaved();
    saved[id] = open ? 'open' : 'closed';
    try { localStorage.setItem('bifrost-folds', JSON.stringify(saved)); } catch (e) {}
    if (id === 'activity') {
      try { localStorage.setItem('bifrost-activity', open ? 'open' : 'collapsed'); } catch (e2) {}
    }
  }
  function foldSum(id, text) {
    var el = $(id); if (el) el.textContent = text;
  }
  var FOLD_OPEN = { mesh: 1, stats: 1, roster: 1, cards: 1, kanban: 1, activity: 1 };
  function applyFolds() {
    if (!document.querySelectorAll) return;
    var saved = foldSaved();
    var legacy = '';
    try { legacy = localStorage.getItem('bifrost-activity') || ''; } catch (e) {}
    if (saved.activity == null) {
      if (legacy === 'open') saved.activity = 'open';
      else if (legacy === 'collapsed') saved.activity = 'closed';
    }
    document.querySelectorAll('[data-fold]').forEach(function (fold) {
      var id = fold.getAttribute('data-fold');
      var open = saved[id] === 'closed' ? false : saved[id] === 'open' ? true : !!FOLD_OPEN[id];
      fold.classList.toggle('collapsed', !open);
      var btn = fold.querySelector('.fold-head');
      if (btn) btn.setAttribute('aria-expanded', open ? 'true' : 'false');
    });
  }
  var cardGroupBtn = $('cardGroup');
  if (cardGroupBtn) cardGroupBtn.addEventListener('click', function () {
    var next = readCardGroup() === 'agent' ? 'status' : 'agent';
    try { localStorage.setItem('bifrost-card-group', next); } catch (e) {}
    wb.key = '';
    renderWave(true);
  });
  document.addEventListener('click', function (ev) {
    var btn = ev.target.closest('.fold-head');
    if (!btn || btn.id === 'cardHistAll' || btn.id === 'waveHistBack') return;
    var fold = btn.closest('[data-fold]');
    if (!fold) return;
    if (fold.id === 'cardHist' && $('wave') && $('wave').classList.contains('hist-open')) return;
    var open = fold.classList.contains('collapsed');
    fold.classList.toggle('collapsed', !open);
    btn.setAttribute('aria-expanded', open ? 'true' : 'false');
    saveFold(fold.getAttribute('data-fold'), open);
  });
  applyFolds();
  (function () {
    var slot = $('agentPing');
    if (!slot || !window.MutationObserver) return;
    var sync = function () {
      slot.hidden = slot.childElementCount === 0 && !String(slot.textContent || '').trim();
    };
    sync();
    new MutationObserver(sync).observe(slot, { childList: true, subtree: true, characterData: true });
  })();
  (function () {
    var btn = $('themeToggle');
    if (!btn) return;
    function themeRoot() {
      var root = document.documentElement;
      if (!root || !root.getAttribute) return null;
      return root;
    }
    function paint() {
      var root = themeRoot();
      if (!root || !btn) return;
      var light = root.getAttribute('data-theme') === 'light';
      btn.textContent = light ? '\u263E' : '\u2600';
      btn.setAttribute('aria-pressed', light ? 'true' : 'false');
    }
    paint();
    btn.addEventListener('click', function () {
      var root = themeRoot();
      if (!root || !root.setAttribute) return;
      var next = root.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
      root.setAttribute('data-theme', next);
      try { localStorage.setItem('bifrost-theme', next); } catch (e) {}
      paintSeatColors();
      L.AGENTS.forEach(function (a) {
        var nm = seatEls[a[0]] && seatEls[a[0]].el.querySelector('.nm');
        if (nm) {
          var ink = L.COLOR[a[0]] || [0, 0, 0];
          nm.style.setProperty('--nm', ink[0] + ', ' + ink[1] + ', ' + ink[2]);
        }
      });
      paint();
    });
  })();
  loadHistoryDays();
  loadCardHist();
  var first = true;
  // A hidden tab skips polls. Coming back clears etag/cursor once so the next poll is not a silent 304,
  // and drops the stamp/key gates so ages and the health strip redraw even when the body is unchanged.
  function armShow() {
    mem.showEtag = mem.etag || '';
    mem.etag = null;
    mem.force = 1;
    mem.showCursor = mem.cursor || '';
    mem.cursor = null;
    mem.forceShow = 1;
  }
  function finishShow() {
    if (!wb.stamp && mem.showStamp) wb.stamp = mem.showStamp;
    if (!mem.cursor && mem.showCursor) mem.cursor = mem.showCursor;
    if (!mem.etag && mem.showEtag) mem.etag = mem.showEtag;
    mem.showStamp = '';
    mem.showCursor = '';
    mem.showEtag = '';
    mem.forceShow = 0;
    wb.key = '';
    trackState.stamp = '';
    lastText = 0;
    renderWave(true);
    renderTrack();
    if (lastQueue) renderQueue(lastQueue);
    paintFresh(Date.now());
  }
  function poll() {
    if (document.hidden && !first) return;
    var show = mem.forceShow;
    if (show) mem.forceShow = 0;
    L.fetchFeed(window.fetch.bind(window), Date.now(), mem).then(function (r) {
      source = r.source; fetchError = '';
      if (show) {
        mem.showStamp = wb.stamp || '';
        wb.stamp = '';
        wb.key = '';
      }
      if (!r.feed) { if (show) finishShow(); return; }
      feedLoaded = true;
      if (L.rosterEntries) {
        var rosterRows = L.rosterEntries(r.feed);
        if (rosterRows && L.rosterKept) rosterRows = L.rosterKept(rosterRows, r.feed);
        if (rosterRows) paintRoster(rosterRows, r.feed);
      }
      if (r.feed.freshness) {
        light.dataAt = Date.parse(r.feed.freshness.github_latest_ct || '') || 0;
        light.cardsAt = Date.parse(r.feed.freshness.cards_at || '') || 0;
        light.moveAt = Date.parse(r.feed.freshness.github_card_latest_ct || '') || 0;
      }
      if (Array.isArray(r.feed.queue)) renderQueue(r.feed.queue);
      var out = L.applyFeed(state, r.feed, Date.now());
      state = out.state;
      window.LIVE_CLOCK = r.feed.clock || null;
      if (r.feed.track) { trackState.track = r.feed.track; trackState.stamp = ''; }
      var clouds = Array.isArray(r.feed.cloud_agents) ? r.feed.cloud_agents : [];
      if (r.feed.board && Array.isArray(r.feed.board.cards)) {
        var ws = JSON.stringify(r.feed.board.cards); wb.stats = r.feed.board.stats || null; ws += JSON.stringify(wb.stats) + JSON.stringify(clouds);
        if (ws !== wb.stamp) { wb.cards = wb.allCards = r.feed.board.cards; wb.cloudAgents = clouds; wb.stamp = ws; wb.key = ''; }
      } else if (JSON.stringify(clouds) !== JSON.stringify(wb.cloudAgents)) {
        wb.cloudAgents = clouds;
        if (!wb.stamp) wb.stamp = 'cloud:' + JSON.stringify(clouds);
        wb.key = '';
      }
      var isNew = {}; out.added.forEach(function (id) { isNew[id] = 1; });
      var fresh = first ? state.events.slice(-6) : state.events.filter(function (e) { return isNew[e.id]; });
      if (first && !reduced && startReplay()) fresh = [];   // live replaces the first-load flashes
      queueFresh(fresh);
      if (state.live) playFresh();
      first = false; lastText = 0; lastLogKey = '';
      if (show) finishShow();
    }).catch(function (err) {
      fetchError = 'feed fetch failed, retrying'; lastText = 0; console.warn(err);
      if (show) finishShow();
    });
  }
  var seenPage = false;
  function onShown() {
    if (document.hidden) return;
    armShow();
    poll();
  }
  document.addEventListener('visibilitychange', function () { if (!document.hidden) onShown(); });
  window.addEventListener('pageshow', function (ev) {
    var firstShow = !seenPage;
    seenPage = true;
    if (firstShow && !ev.persisted) return;
    onShown();
  });
  poll();
  setInterval(poll, L.POLL_MS);
  requestAnimationFrame(frame);
})();
</script>
